#
# Docker Compose staging stack (R6, OBI-42; plan r4 §3.4, decisions
# D-P1.7-D-P1.14). Declared here, reconciled onto the host by
# staging/reconcile.sh + a systemd timer. Every image is pinned by digest
# in staging/images.env -- there are no floating tags in this file.
#
# Kept Flux-friendly per plan §3.4.3: one Kustomize-shaped directory
# (`staging/`), no host-path bind mounts outside `staging/` itself, all
# config through images.env + secrets.env (a straightforward drop-in
# replacement for a Flux `ConfigMapGenerator`/SOPS-decrypted Secret later),
# named volumes only, and services split one-per-concern so each maps
# cleanly onto a future Deployment/StatefulSet/CronJob (see the PR
# description checklist for the full review).

name: loom

services:
  loom:
    image: ${LOOM_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["serve", "--mudlib", "/mudlib"]
    labels:
      # Not read by anything. It puts WARP_REF into this service's config
      # hash, so `up -d` recreates loom when the mudlib ref moves (OBI-152:
      # otherwise mudlib-sync would swap the volume under a running driver
      # that keeps the old master loaded). B3.5/OBI-192 (D-B3.6): since
      # mudlib-sync is now seed-only, this label only fires a real
      # (harmless) recreate on an *unseeded* volume's first boot --
      # WARP_REF is the bootstrap ref only; editing it after the first
      # seed does not move the mudlib (there is no reset left to race) and
      # recreating loom for that edit alone would be exactly the
      # unintended restart the driver's copyover story exists to avoid.
      # Left in place for the pre-seed case rather than removed.
      org.loommud.warp-ref: ${WARP_REF}
    environment:
      LOOM_TELNET_ADDR: 0.0.0.0:4000
      # loom-http (health/ready/metrics/WS). Pinned explicitly: the binary's
      # default is 0.0.0.0:4001 (DEFAULT_HTTP_ADDR, loom-cli), but Caddy,
      # Prometheus and the healthcheck below all target :8080.
      LOOM_HTTP_ADDR: 0.0.0.0:8080
      # loom_app (D-27.4, OBI-130): the world-runtime login. Not an owner,
      # no DDL rights, no INSERT/UPDATE/DELETE on the role tables (see
      # loom-persist/migrations/0001_init.sql). Never the superuser and
      # never loom_owner (that login is for migrations only, below).
      DATABASE_URL: postgres://loom_app:${LOOM_APP_PASSWORD}@loom-db:5432/loom
      # Character saves (save_object/restore_object, loom OBI-171; warp
      # OBI-172). Without this the driver defaults to <mudlib>/../saves,
      # i.e. /saves in the container's own (non-persistent) filesystem,
      # which the loom user can't even write -- every save would fail and
      # characters would be lost on each restart. Kept out of the `mudlib`
      # volume on purpose: it's a separate volume/concern from the Git
      # working tree below, and must never be part of the mudlib tree.
      LOOM_SAVE_DIR: /saves
      # loom-git (B3.5/OBI-192, D-B3.6/D-B3.11): the driver owns a writable
      # Git working tree after the first seed (mudlib-sync, below) instead
      # of a read-only pinned checkout. GIT_DIR is the separate
      # `mudlib-git` volume (D-B3.2) -- nothing named `.git` ever exists
      # under `/mudlib`. With no App configured (secrets are placeholders
      # until Q-P2.3), loom-git logs a warning at boot and runs with
      # push/propose disabled -- see staging/RUNBOOK.md.
      LOOM_GIT_ENV: staging
      LOOM_GIT_APP_ID: ${LOOM_GIT_APP_ID:-}
      LOOM_GIT_INSTALLATION_ID: ${LOOM_GIT_INSTALLATION_ID:-}
      LOOM_GIT_REPO: ${LOOM_GIT_REPO:-LoomMud/warp}
    secrets:
      # D-B3.11: the GitHub App private key, mounted read-only at exactly
      # `/run/secrets/warp_app.pem` and never passed any other way (not
      # argv, not an env var, not the VFS). Placeholder content until
      # Q-P2.3 provisions the real App (SETUP.md); loom-git treats a
      # missing/placeholder key the same as "no App configured".
      - source: warp_app_pem
        target: warp_app.pem
        mode: 0400
      # D-B3.12: the webhook HMAC secret for `POST /api/v1/hooks/github`.
      - source: warp_webhook
        target: warp_webhook
        mode: 0400
    volumes:
      - mudlib:/mudlib
      - mudlib-git:/mudlib-git
      - saves:/saves
    ports:
      # Telnet: published directly (D-P1.14), not proxied by Caddy or
      # Cloudflare (SETUP.md §5.3).
      - "4000:4000"
    # HTTP :8080 (health/ready/metrics/WS/web client) is internal-only:
    # no `ports:` entry, reached by `caddy` over the compose network only.
    expose:
      - "8080"
    healthcheck:
      # loom probe (loom#42, cbaebb6) + loom-http's /healthz shipped in
      # LOOM_IMAGE v0.1.0-alpha.2 (OBI-132). Uses the driver's own HTTP
      # client against its own liveness endpoint instead of a bare
      # /dev/tcp TCP-open check on the telnet port. Needs LOOM_HTTP_ADDR
      # above: loom's built-in default HTTP bind is 0.0.0.0:4001.
      test: ["CMD", "/usr/local/bin/loom", "probe", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      mudlib-sync:
        condition: service_completed_successfully
      # loom#51/OBI-130/OBI-138: LOOM_IMAGE now ships `loom migrate`, so
      # the one-shot migration runner below is a real `depends_on`, not a
      # manual step -- `docker compose up -d` always applies pending
      # loom_owner migrations before `loom` starts.
      migrate:
        condition: service_completed_successfully
      saves-init:
        condition: service_completed_successfully

  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      loom:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    # Internal only: no `ports:` entry. Reachable from `loom`, `migrate`
    # and `backup` over the compose network, never published to the host.
    #
    # DB role separation (OBI-130, D-27.4): POSTGRES_USER here is the
    # Postgres *superuser*, used only by ./postgres/init/01-create-roles.sh
    # (docker-entrypoint-initdb.d, first init of an empty `pgdata` volume
    # only) to create `loom_owner` (owns the DB, runs migrations) and
    # `loom_app` (the world-runtime login, granted narrow privileges by
    # the migrations themselves). The superuser login below is never in
    # DATABASE_URL or LOOM_DB_MIGRATE_URL -- it is never used by the `loom`,
    # `migrate` or `backup` services, matching CI's setup step
    # (LoomMud/loom .github/workflows/ci.yml).
    environment:
      POSTGRES_USER: loom_superuser
      POSTGRES_DB: loom
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      LOOM_OWNER_PASSWORD: ${LOOM_OWNER_PASSWORD}
      LOOM_APP_PASSWORD: ${LOOM_APP_PASSWORD}
    # loom/warp refuse to connect to the literal host `postgres:5432`
    # (loom-persist `assert_not_control_plane_db`, OBI-151): that is the
    # shape of Paperclip's control-plane DSN. Loom's own DSNs therefore use
    # this network alias instead of the service name.
    networks:
      default:
        aliases: [loom-db]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom_superuser -d loom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Seed-only (D-B3.6/B3.5, OBI-192 -- supersedes the D-P1.11 reset-on-bump
  # behaviour below once a tree exists): the first time this runs,
  # `/mudlib-git/warp.git` does not exist, so it clones `WARP_REPO`,
  # creates `live` at `WARP_REF`, and checks it out into the separate
  # `/mudlib` work tree (D-B3.2: `GIT_DIR` and the work tree are always
  # distinct -- nothing named `.git` ever appears under `/mudlib`). Every
  # run after that -- including a `WARP_REF` bump in `images.env` -- is a
  # pure no-op: the driver owns the tree from here on (`loom-git`'s
  # `GitWorker`, auto-commits, sync off GitHub's `main`), and WARP_REF
  # is bootstrap-only after the first seed (RUNBOOK.md). A reset here
  # would silently discard every live builder edit, which is exactly the
  # bug class B3 exists to close.
  #
  # loom-gitops#36 review (B1/S1 fixes): staging's `mudlib` volume predates
  # B3 and already holds a pre-B3 tree + `.warp-ref` (D-P1.11) the first
  # time this runs there -- `git checkout` onto a non-empty work tree
  # aborts ("untracked working tree files would be overwritten"), and
  # worse, `git init` had already written `warp.git/HEAD` by that point, so
  # the *next* reconcile would hit the no-op fast path above with no
  # `live` branch at all. Fixed by building the bare repo in a scratch dir
  # and `mv`-ing it into place only after checkout + chown succeed (so a
  # crash mid-seed never leaves a false-positive `HEAD` behind), and by
  # clearing `/mudlib` before checkout -- safe, because reaching that line
  # means no `GIT_DIR` existed yet, i.e. either a genuinely empty volume
  # or the pre-B3 regime (mounted `:ro`, so it can't hold builder edits).
  # Also drops `--depth 1`: loom-git (OBI-190) merges `origin/main` into
  # `live`, which needs a real merge base, not a single shallow commit.
  mudlib-sync:
    image: ${GIT_SYNC_IMAGE}
    restart: "no"
    environment:
      WARP_REPO: ${WARP_REPO}
      WARP_REF: ${WARP_REF}
      # Matches the loom image's `loom` user (Dockerfile: `useradd
      # --system --uid 10001`). This container runs as root (the
      # upstream alpine/git image sets no USER), so the tree it seeds
      # must be handed to that uid before `loom` -- which never runs as
      # root -- can write to it.
      LOOM_UID: ${LOOM_UID:-10001}
    volumes:
      - mudlib:/mudlib
      - mudlib-git:/mudlib-git
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        git_dir=/mudlib-git/warp.git
        if [ -f "$$git_dir/HEAD" ]; then
          echo "mudlib-sync: $$git_dir already seeded, no-op (D-B3.6)"
          exit 0
        fi
        echo "mudlib-sync: seeding $$git_dir + /mudlib from ${WARP_REPO} @ ${WARP_REF}"
        tmp_git_dir=/mudlib-git/warp.git.tmp
        rm -rf "$$tmp_git_dir"
        git init --quiet --bare -b main "$$tmp_git_dir"
        git --git-dir="$$tmp_git_dir" remote add origin "${WARP_REPO}"
        git --git-dir="$$tmp_git_dir" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
        target="$$(git --git-dir="$$tmp_git_dir" rev-parse --verify --quiet "${WARP_REF}^{commit}" || true)"
        if [ -z "$$target" ]; then
          # WARP_REF may be a SHA that isn't any current branch tip (e.g. a
          # since-deleted branch); GitHub allows fetching an exact
          # reachable SHA directly even without --depth.
          git --git-dir="$$tmp_git_dir" fetch --quiet origin "${WARP_REF}"
          target="$$(git --git-dir="$$tmp_git_dir" rev-parse --verify FETCH_HEAD^{commit})"
        fi
        find /mudlib -mindepth 1 -delete
        git --git-dir="$$tmp_git_dir" --work-tree=/mudlib checkout --quiet -b live "$$target"
        chown -R "${LOOM_UID}:${LOOM_UID}" /mudlib "$$tmp_git_dir"
        mv "$$tmp_git_dir" "$$git_dir"
        echo "mudlib-sync: done, live at $$(git --git-dir="$$git_dir" rev-parse live)"

  # One-shot (OBI-172): a new named volume is created root-owned, but the
  # loom image runs as the unprivileged `loom` user (uid 10001, loom's
  # Dockerfile), so hand the `saves` volume's root to that uid before
  # `loom` starts. Idempotent: a no-op chown/chmod on every later `up`.
  # Never touches what is inside the volume.
  saves-init:
    image: ${GIT_SYNC_IMAGE}
    restart: "no"
    volumes:
      - saves:/saves
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        chown 10001:10001 /saves
        chmod 0700 /saves
        echo "saves-init: /saves owned by 10001, mode 0700"

  # One-shot migration runner (D-27.4, OBI-130/OBI-138): applies
  # loom-persist's sqlx migrations as `loom_owner`, the schema owner --
  # never the superuser, never `loom_app`. Runs on every default
  # `docker compose up -d` (it's a real `depends_on` of `loom`, above) and
  # exits 0 once migrations are applied, so a healthy re-run with nothing
  # pending is a fast no-op, not an error.
  migrate:
    image: ${LOOM_IMAGE}
    restart: "no"
    command: ["migrate"]
    environment:
      LOOM_DB_MIGRATE_URL: postgres://loom_owner:${LOOM_OWNER_PASSWORD}@loom-db:5432/loom
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly backup: pg_dump + mudlib tarball, age-encrypted, uploaded to
  # Azure Blob (D-P1.12, superseded from S3 per OBI-62/R6-12). Disabled by
  # default: the board deferred backup credentials (OBI-109), so
  # AZURE_STORAGE_ACCOUNT/CONTAINER/SAS_TOKEN and BACKUP_AGE_RECIPIENT are
  # empty in staging/images.env and staging/secrets.env.example until then.
  # backup.sh checks for that and exits 0 (a documented no-op), so an empty
  # config never fails a reconcile. Started by staging/loom-backup.timer,
  # not by `docker compose up` (`profiles: ["backup"]` keeps it out of the
  # default `up -d`; the timer runs `docker compose run --rm backup`).
  # pg_dump runs as `loom_owner` (OBI-130): it owns every table, so a dump
  # captures the full schema/definitions without needing superuser access.
  backup:
    image: ${BACKUP_IMAGE}
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      LOOM_OWNER_PASSWORD: ${LOOM_OWNER_PASSWORD}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      AZURE_STORAGE_SAS_TOKEN: ${AZURE_STORAGE_SAS_TOKEN:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - mudlib:/mudlib:ro
      # Character saves (OBI-172/OBI-241): read-only, same reasoning as
      # the mudlib mount above -- backup.sh only ever reads this volume.
      - saves:/saves:ro
      # OBI-192/B3.5 (D-B3.6): the driver's own Git history, a second copy
      # of everything `live/<env>` already has on GitHub but also the
      # fastest way to rebuild a host without a network dependency.
      - mudlib-git:/mudlib-git:ro
      # OBI-175 (P2-O4): shared with the `alerts` service below so its
      # backup-failure check can read what this run reported. A plain
      # bind mount under staging/ (not a named volume), same pattern as
      # the Caddyfile/backup.sh mounts above -- nothing in it needs to
      # survive `compose down -v`.
      - ./alerts-state:/alerts-state
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot alert check (OBI-175/P2-O4): reconcile/deploy failure,
  # /readyz down > 2 min, backup failure, and runtime-error rate (once
  # OBI-169/P2-B4 lands). Run every minute by loom-alerts.timer
  # (`docker compose --profile alerts run --rm alerts`). On the default
  # compose network so it can reach `loom:8080` directly, the same
  # reason `migrate`/`backup` don't need LOOM_HTTP_ADDR published to the
  # host. See staging/alerts.sh for what each check does and where
  # alerts are delivered (a GitHub issue, labeled "alert", in this repo
  # -- the channel this team already watches, not a new chat tool).
  alerts:
    image: ${ALERTS_IMAGE}
    profiles: ["alerts"]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/alerts.sh"]
    environment:
      GITHUB_ALERTS_TOKEN: ${GITHUB_ALERTS_TOKEN:-}
    volumes:
      - ./alerts.sh:/scripts/alerts.sh:ro
      - ./alerts-state:/alerts-state

  # Optional observability profile: `docker compose --profile obs up -d`.
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: ${GRAFANA_IMAGE}
    profiles: ["obs"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"

volumes:
  pgdata:
  mudlib:
  # Character saves (OBI-172). Survives container recreation and WARP_REF
  # bumps; only `compose down -v` removes it. Covered by the nightly
  # backup and the restore drill (OBI-241), the same as mudlib/postgres.
  saves:
  # OBI-192/B3.5 (D-B3.2/D-B3.6): the separate Git dir (`GIT_DIR=
  # /mudlib-git/warp.git`) that backs the `/mudlib` work tree. Kept apart
  # from `mudlib` itself so nothing named `.git` ever exists under the
  # confined VFS root loom-vm resolves paths against.
  mudlib-git:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:

# OBI-192/B3.5 (D-B3.11/D-B3.12): file-based secrets (plain `docker
# compose`, not swarm): loom-gitops#36 review (B3) -- `mode:`/`target:`
# above are bind-mount hints only; plain (non-swarm) Compose does not
# translate them, so the enforcement that actually matters is the *host*
# file's own owner/mode: 0400, owned by numeric uid 10001 (the container's
# `loom` user, Dockerfile `useradd --uid 10001`) -- not whatever uid the
# host's own `loom` service account happens to have. See RUNBOOK.md §11
# and reconcile.sh (placeholder install) for how that ownership is set.
# Real values never get committed -- see .gitignore and
# staging/secrets/*.example.
secrets:
  warp_app_pem:
    file: ./secrets/warp_app.pem
  warp_webhook:
    file: ./secrets/warp_webhook
