name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dco:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DCO sign-off
        # Check only the commits this event introduces. On push, a scan of all
        # history would re-flag commits already on main (same fix as loom
        # OBI-57). A zero or unknown `before` (new branch / force push) falls
        # back to HEAD.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-dco.sh "$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/check-dco.sh "$BEFORE..$AFTER"
          else
            scripts/check-dco.sh HEAD
          fi
  hygiene:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          workdir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$workdir"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$workdir/gitleaks.tar.gz"
          tar -xzf "$workdir/gitleaks.tar.gz" -C "$workdir" gitleaks
          "$workdir/gitleaks" git --redact --exit-code 1 .
      - uses: fsfe/reuse-action@v5

  # Renders and partially boots the R6 (OBI-42) staging stack. This repo's
  # dev sandbox has neither docker nor cargo, so this job -- not a local
  # run -- is the real evidence that staging/compose.yaml is well-formed
  # and that the pieces that don't need a private GHCR pull actually come
  # up healthy. It cannot boot `loom`/`caddy` (private image, real TLS
  # domain) or exercise the digest-bump/persistence drill; that needs
  # either a public GHCR package (OBI-109) or the real host (OBI-106).
  compose-validate:
    runs-on: ${{ (vars.CI_RUNS_ON && !github.event.pull_request.head.repo.fork) && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck staging scripts
        run: |
          set -euo pipefail
          # SC1090/SC1091: reconcile.sh/restore.sh source images.env/secrets.env by a
          # runtime path, which shellcheck can't statically follow -- expected, not a bug.
          # SC2015 (restore.sh usage guard): `A && B || C` is intentional here; C (usage)
          # only runs when a required arg check fails, and usage() always exits nonzero.
          shellcheck --exclude=SC1090,SC1091,SC2015 staging/*.sh
      - name: render full compose config (no image pull)
        run: |
          set -euo pipefail
          # Exact command from the loom-gitops#8 review (both env files, so
          # secrets.env.example's placeholder names are also validated).
          docker compose \
            --env-file staging/images.env \
            --env-file staging/secrets.env.example \
            -f staging/compose.yaml config >/dev/null
      - name: validate Caddyfile
        run: |
          set -euo pipefail
          . staging/images.env
          docker run --rm \
            -v "$PWD/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile
      # Full drill requested in the loom-gitops#8 review: `up -d` once, then
      # again, proving the second run recreates nothing and does not reset
      # the mudlib volume. `loom`/`caddy` can't be pulled here yet (private
      # GHCR image, blocked on OBI-109), so "full" is postgres + mudlib-sync
      # -- the two services that own the D-P1.11 idempotency bug this task
      # fixes. That gap is tracked, not hidden: see the loom/caddy pull step
      # below.
      - name: up -d (boot 1)
        env:
          POSTGRES_PASSWORD: ci-throwaway-password
        run: |
          set -euo pipefail
          docker compose --env-file staging/images.env --env-file staging/secrets.env.example \
            -f staging/compose.yaml up -d postgres mudlib-sync
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --env-file staging/images.env --env-file staging/secrets.env.example -f staging/compose.yaml ps -q postgres)")
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ] || { echo "postgres never became healthy"; docker compose --env-file staging/images.env --env-file staging/secrets.env.example -f staging/compose.yaml logs postgres; exit 1; }
          mudlib_sync_cid="$(docker compose --env-file staging/images.env --env-file staging/secrets.env.example -f staging/compose.yaml ps -a -q mudlib-sync)"
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$mudlib_sync_cid")" = 0 ] || { docker compose --env-file staging/images.env --env-file staging/secrets.env.example -f staging/compose.yaml logs mudlib-sync; exit 1; }
          # mudlib-sync strips /mudlib/.git after checkout (compose.yaml), so identity is
          # tracked by the .warp-ref marker file written at the end of the script (this
          # task's fix for the review's wipe-on-every-reconcile bug), not `git log`.
          docker run --rm -v loom_mudlib:/m alpine cat /m/.warp-ref
          echo "boot 1: postgres healthy, mudlib-sync exited 0, container ids:"
          docker compose --env-file staging/images.env --env-file staging/secrets.env.example -f staging/compose.yaml ps -a --format 'table {{.Name}}\t{{.ID}}\t{{.Status}}'
      - name: up -d (boot 2) -- must not recreate containers or reset mudlib
        env:
          # Same value as boot 1: postgres's environment is baked from this at
          # compose-parse time, so a mismatched value here (not present in
          # secrets.env.example) would recreate the container for a reason
          # that has nothing to do with the D-P1.11 bug this job checks for.
          POSTGRES_PASSWORD: ci-throwaway-password
        run: |
          set -euo pipefail
          compose() {
            docker compose --env-file staging/images.env --env-file staging/secrets.env.example -f staging/compose.yaml "$@"
          }
          before_postgres_id="$(compose ps -q postgres)"
          before_ref="$(docker run --rm -v loom_mudlib:/m alpine cat /m/.warp-ref)"
          before_hash="$(docker run --rm -v loom_mudlib:/m alpine sh -c 'find /m -type f | sort | xargs -r sha256sum' | sha256sum)"
          # Scoped to postgres + mudlib-sync: `loom`/`caddy` can't be pulled here yet
          # (private GHCR image, OBI-109), and an unscoped `up -d` would try and fail
          # on those two before ever reaching the idempotency check this job exists for.
          compose up -d postgres mudlib-sync
          after_postgres_id="$(compose ps -q postgres)"
          after_ref="$(docker run --rm -v loom_mudlib:/m alpine cat /m/.warp-ref)"
          after_hash="$(docker run --rm -v loom_mudlib:/m alpine sh -c 'find /m -type f | sort | xargs -r sha256sum' | sha256sum)"
          [ "$before_postgres_id" = "$after_postgres_id" ] || { echo "postgres container was recreated on a no-op reconcile"; exit 1; }
          [ "$before_ref" = "$after_ref" ] || { echo ".warp-ref changed on a no-op re-run"; exit 1; }
          [ "$before_hash" = "$after_hash" ] || { echo "mudlib-sync reset the volume on a no-op re-run (D-P1.11 violated)"; exit 1; }
          mudlib_sync_exit="$(docker inspect -f '{{.State.ExitCode}}' "$(compose ps -a -q mudlib-sync)")"
          [ "$mudlib_sync_exit" = 0 ] || { compose logs mudlib-sync; exit 1; }
          echo "boot 2: postgres container id unchanged ($after_postgres_id), .warp-ref unchanged ($after_ref), mudlib volume hash unchanged, mudlib-sync exited 0"
          compose down -v
      - name: attempt loom image pull (informational; expected to fail until OBI-109 makes it public)
        continue-on-error: true
        run: |
          . staging/images.env
          docker pull "$LOOM_IMAGE" && echo "LOOM_IMAGE is pullable" || echo "LOOM_IMAGE pull failed (expected while GHCR package is private, OBI-109)"
