#
# staging/images.env image-bump automation (R6, OBI-42; D-P1.9). Opens a
# PR that updates LOOM_IMAGE to the newest signed pre-release digest.
# Merge = deploy (the reconciler picks it up on its next 2-minute run);
# revert the merge = rollback.
#
# Triggers:
#   - repository_dispatch (type: loom-release), meant to be fired by the
#     R5 release job in LoomMud/loom on a successful tag push. That job
#     needs a cross-repo token (a fine-grained PAT scoped to
#     LoomMud/loom-gitops contents+PRs, or a GitHub App), which is not
#     provisioned yet -- until it is, this dispatch never fires and the
#     schedule below is the only trigger. Tracked as a follow-up on OBI-42.
#   - schedule, every 15 minutes: polls GHCR directly, so image bumps
#     aren't silently missed while the dispatch wiring above doesn't
#     exist. Harmless/no-op (no PR) if nothing new was published.
#   - workflow_dispatch: manual run.
name: bump-staging

on:
  repository_dispatch:
    types: [loom-release]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  bump:
    runs-on: ${{ (vars.CI_RUNS_ON && startsWith(vars.CI_RUNS_ON, '[')) && fromJSON(vars.CI_RUNS_ON) || (vars.CI_RUNS_ON || 'ubuntu-latest') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # OBI-42/OBI-157 gap: staging/reconcile.sh already posts a red
      # `staging/reconcile` commit status on failure (see reconcile.sh's
      # `fail()`), but nothing was watching it -- the alpha.4 DB-guard
      # incident sat broken for about an hour before a human noticed. This
      # step makes that red status loud: every run of this workflow (the
      # 15-minute schedule included) refuses to open a new bump PR on top
      # of a broken reconcile and fails the job instead, so a red
      # `bump-staging` Actions run (with notifications, if watchers are
      # subscribed) tracks a broken `staging/reconcile` within 15 minutes,
      # not an hour. It also stops bumps from stacking on top of an
      # already-broken deploy. This is a gate, not a fix: once
      # `staging/reconcile` is green again (the next reconciler run after
      # the underlying problem is fixed), this step -- and normal bumping
      # -- resumes on its own.
      - name: Wait for a green staging/reconcile before bumping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          latest="$(gh api "repos/LoomMud/loom-gitops/commits/${sha}/statuses" \
            --jq '[.[] | select(.context=="staging/reconcile")][0]')"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::warning::no staging/reconcile status found at ${sha} yet (fresh host or first-ever reconcile); proceeding"
            exit 0
          fi
          state="$(echo "$latest" | jq -r '.state')"
          description="$(echo "$latest" | jq -r '.description')"
          if [ "$state" != "success" ]; then
            echo "::error::staging/reconcile is '${state}' at ${sha} (${description}); refusing to bump LOOM_IMAGE on top of a broken reconcile. Fix staging first (RUNBOOK.md §7 rollback or §8 post-deploy checklist), confirm the reconciler is green, then re-run this workflow (schedule or workflow_dispatch)."
            exit 1
          fi
          echo "staging/reconcile is green at ${sha} (${description}); proceeding"

      - name: Install cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.6.1
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Newest pre-release version of ghcr.io/loommud/loom, by GHCR
      # package-version creation time. Needs `packages: read` and, while
      # the package is private (pending OBI-109), org membership/linkage
      # that lets this repo's GITHUB_TOKEN see LoomMud/loom's package
      # versions; if that 403s, the job fails loudly rather than silently
      # skipping (see the `gh api` step's error handling).
      - name: Find newest pre-release digest
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versions_json="$(gh api -H "Accept: application/vnd.github+json" \
            "/orgs/LoomMud/packages/container/loom/versions?per_page=50")"
          # Pre-release tags only (vX.Y.Z-alpha.N / -beta.N / -rc.N), newest
          # `created_at` first. `latest` and bare `vX.Y.Z` releases are not
          # staging material.
          newest="$(echo "$versions_json" | jq -r '
            [.[] | select(.metadata.container.tags[]? | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc)\\."))]
            | sort_by(.created_at) | last
          ')"
          if [ "$newest" = "null" ] || [ -z "$newest" ]; then
            echo "no pre-release version found; nothing to do"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest="$(echo "$newest" | jq -r '.name')"          # GHCR version "name" is the sha256 digest
          tag="$(echo "$newest" | jq -r '.metadata.container.tags[0]')"
          echo "digest=sha256:${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: cosign verify
        if: steps.find.outputs.digest != ''
        run: |
          set -euo pipefail
          cosign verify "ghcr.io/loommud/loom@${{ steps.find.outputs.digest }}" \
            --certificate-identity-regexp '^https://github.com/LoomMud/loom/\.github/workflows/release-image\.yml@refs/tags/.*$' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Update images.env if changed
        id: update
        if: steps.find.outputs.digest != ''
        run: |
          set -euo pipefail
          new="ghcr.io/loommud/loom@${{ steps.find.outputs.digest }}"
          current="$(grep '^LOOM_IMAGE=' staging/images.env | cut -d= -f2-)"
          if [ "$current" = "$new" ]; then
            echo "LOOM_IMAGE already up to date ($new); nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|^LOOM_IMAGE=.*|LOOM_IMAGE=${new}|" staging/images.env
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          token: ${{ github.token }}
          branch: bump-staging/loom-${{ steps.find.outputs.tag }}
          delete-branch: true
          # Explicit author, matching the Signed-off-by trailer below
          # exactly (OBI-155): without this the action defaults the commit
          # author to whichever identity triggered the run (workflow_dispatch
          # takes github.actor; that isn't a fixed bot until per-agent GitHub
          # identities land, OBI-43), which mismatches the hardcoded
          # Signed-off-by trailer and fails the dco check on the PR it opens.
          author: "bump-staging[bot] <noreply@paperclip.ing>"
          commit-message: |
            staging: bump LOOM_IMAGE to ${{ steps.find.outputs.tag }}

            Signed-off-by: bump-staging[bot] <noreply@paperclip.ing>
          title: "staging: bump LOOM_IMAGE to ${{ steps.find.outputs.tag }}"
          body: |
            Automated bump (D-P1.9). Newest signed pre-release digest for
            `ghcr.io/loommud/loom`, found via GHCR and `cosign verify`-ed
            against the `LoomMud/loom` `release-image.yml` OIDC identity
            before this PR was opened.

            - Tag: `${{ steps.find.outputs.tag }}`
            - Digest: `${{ steps.find.outputs.digest }}`
            - Release: https://github.com/LoomMud/loom/releases/tag/${{ steps.find.outputs.tag }}

            **Merge = deploy** (the reconciler picks this up on its next
            2-minute run and recreates the `loom` container; SIGTERM lets
            it save state and close sockets, D-P1.10). **Revert this merge
            commit = rollback** to the previous digest.
          labels: staging-bump
